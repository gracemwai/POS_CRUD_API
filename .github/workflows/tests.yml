name: POS Backend CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Directly download core application libraries
        pip install fastapi sqlalchemy python-dotenv pydantic httpx pytest
        
        # If your files live inside a backend subfolder, search and install automatically:
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f backend/Projects/POS/requirements.txt ]; then pip install -r backend/Projects/POS/requirements.txt; fi

    - name: Execute Pytest Suite
      env:
        database_url: "sqlite:///./test.db"
      run: |
        python -m pytest -v --disable-warnings
